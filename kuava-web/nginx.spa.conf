# Nginx interno do contentor kuava-web — serve os ficheiros estáticos do
# build do Vite. É uma single-page app: qualquer rota que não corresponda a
# um ficheiro real (ex.: /dashboard, /pos) tem de cair em index.html para o
# React Router decidir o que mostrar, senão dá 404 ao recarregar a página.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ficheiros com hash no nome (JS/CSS gerados pelo Vite) podem ser
    # cacheados de forma agressiva — o nome muda sempre que o conteúdo muda.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca deve ser cacheado — é ele que aponta para os
    # ficheiros com hash mais recentes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
