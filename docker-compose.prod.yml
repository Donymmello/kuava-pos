# Ambiente de PRODUÇÃO do Kuava POS — VPS partilhado com o vektra-site,
# atrás do MESMO Caddy que já serve vektramz.com (ver /opt/vektra-site no
# VPS). Não há Nginx nem certificado geridos por este stack — o Caddy já
# existente trata do TLS para kuava.vektramz.com também, só precisa de um
# bloco novo no Caddyfile dele a apontar para "web"/"api" abaixo (ver
# deploy/README.md).
#
# Diferenças chave em relação ao docker-compose.yml (dev):
#   - sem bind mounts de código, sem hot-reload — cada imagem já tem o
#     código compilado embutido (ver kuava-api/Dockerfile e
#     kuava-web/Dockerfile);
#   - segredos nunca ficam neste ficheiro (que é versionado em git) — vêm
#     de .env.production (nunca commitado, ver .env.production.example);
#   - Postgres não expõe a porta 5432 ao anfitrião — só api e postgres
#     conversam, dentro da rede interna do Docker;
#   - "web" e "api" juntam-se também à rede externa "web" (partilhada com o
#     vektra-site) só para o Caddy de lá os conseguir alcançar por nome —
#     nenhum dos dois publica portas ao anfitrião.
#
# Uso (a partir da raiz do repositório):
#   cp .env.production.example .env.production   # e preenche os valores reais
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Depois de subir pela primeira vez, falta ainda: aplicar as migrações,
# criar o superadmin, e adicionar o bloco do Caddyfile — ver deploy/README.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kuava-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kuava_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem "ports:" de propósito — não expor a base de dados diretamente à
    # internet. Só o serviço "api", dentro da mesma rede Docker, lhe acede.

  api:
    build:
      context: ./kuava-api
      dockerfile: Dockerfile
    container_name: kuava-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    # "default" para continuar a falar com o postgres (mesmo projeto), "web"
    # só para o Caddy do vektra-site conseguir chegar a http://api:3333 —
    # nenhuma porta publicada ao anfitrião, o Caddy é sempre o único a
    # aparecer na internet.
    networks: [default, web]

  web:
    build:
      context: ./kuava-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: kuava-web-prod
    restart: always
    depends_on:
      - api
    # Idem — o Caddy alcança http://web:80 pela rede "web".
    networks: [default, web]

networks:
  # Já existe no VPS, criada pelo vektra-site — nunca é criada nem apagada
  # por este ficheiro, só nos juntamos a ela.
  web:
    name: web
    external: true

volumes:
  kuava_postgres_prod_data:
